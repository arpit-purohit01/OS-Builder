# Golden build-VM image (build-pipeline.md §4). Built by scripts/make-builder-image.sh;
# workers boot it read-only (qcow2 backing file + per-build overlay).
[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe
Mirror=http://archive.ubuntu.com/ubuntu

[Output]
Format=disk
ImageId=foundry-builder
Output=foundry-builder

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
KernelCommandLine=console=ttyS0 systemd.firstboot=no systemd.show_status=error
KernelInitrdModules=default
Packages=
        linux-image-virtual
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-ukify
        systemd-container
        udev
        dbus
        apt
        dpkg
        python3
        erofs-utils
        dosfstools
        mtools
        cryptsetup-bin
        zstd
        xz-utils
        e2fsprogs
        fdisk
        util-linux
        kmod
        ca-certificates
        gnupg
        ubuntu-keyring
        debian-archive-keyring
        openssl
        squashfs-tools
RootPassword=hashed:!
ExtraTrees=/opt/src/mkosi:/opt/mkosi
RemoveFiles=/var/cache/apt /var/lib/apt/lists
